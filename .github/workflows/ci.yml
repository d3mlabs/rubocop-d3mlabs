# CI runs what a developer runs: `dev up`, then the check verbs dev.yml
# defines — `dev style`, `dev test`. Nothing here invokes the toolchain
# directly: dev provisions the locked Ruby and gems from dependencies.rb,
# and every dev command errors in CI when the manifest and the lock
# disagree, so a dependencies.rb edit without `dev deps update` fails the
# first step. GH_TOKEN is the credential the action's toolchain check
# requires; the job's own token reaches every pin this public tap serves.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: d3mlabs/dev/up@main
      - run: dev style

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: d3mlabs/dev/up@main
      - run: dev test
