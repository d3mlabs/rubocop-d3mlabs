name: Publish to rubygems.org

# `dev release <version>` cuts the release: bumps VERSION, tags, pushes,
# packages the gem at the tag and attaches rubocop-d3mlabs-<version>.gem and
# release.json to the GitHub release. Shipping that exact, SHA-verified asset
# is dev's `deploy rubygems --release <version>` — run here rather than on
# an operator's machine so the rubygems credential is a one-job OIDC token
# (rubygems.org trusted publishing) and no API key is stored anywhere:
# configure-rubygems-credentials exports GEM_HOST_API_KEY, the first link of
# dev's credential chain, so the publisher never reaches `dev cred`.
#
# `published` fires when `dev release` creates the release, which is before
# it uploads the assets; the wait step below bridges that gap. The manual
# trigger re-runs a publish (a failed job, a publisher registered late).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "release version to publish (e.g. 1.0.0); its GitHub release must carry the .gem and release.json"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # The hosted recipe (dev's README): install Homebrew + dev when the host
      # has none, then `dev up` — the same line a warm box or a checkpoint
      # runs as a probe. dev#545 lifts these two steps into a shared action.
      - uses: Homebrew/actions/setup-homebrew@main
      # Homebrew 7 trusts taps per user and the prompt dies on a
      # non-interactive runner: trust the tap up front, which covers dev,
      # its dev-core dependency and the lock's ruby@ bottle.
      - name: Install dev
        run: |
          brew tap d3mlabs/d3mlabs
          brew trust --tap d3mlabs/d3mlabs
          brew install d3mlabs/d3mlabs/dev
      # Converges the host (the data root under sudo, the org tooling) and
      # installs the lock — the project Ruby and gems.
      - name: dev up
        run: dev up

      - name: Wait for the release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for _ in $(seq 1 30); do
            if gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -qx 'release.json'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::release v$VERSION carries no release.json after 5 minutes — did dev release finish?"
          exit 1

      # The OIDC exchange, done by hand: rubygems.org requires the owning
      # account (`owner`) on the exchange when the gem does not exist yet —
      # the pending trusted publisher's account — and
      # rubygems/configure-rubygems-credentials has no `owner` input yet.
      # Swap back to the action once it does. The 15-minute push key lands in
      # GEM_HOST_API_KEY, the first link of dev's credential chain.
      - name: Configure RubyGems credentials (trusted publisher, OIDC)
        env:
          # rubygems.org account ID (immutable; the handle can be renamed) of
          # the pending publisher's owner — jpduchesne.
          RUBYGEMS_OWNER: "148200"
        run: |
          jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          response=$(curl -sS -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER" '{jwt: $jwt, owner: $owner}')")
          key=$(jq -r '.rubygems_api_key // empty' <<<"$response")
          if [ -z "$key" ]; then
            echo "::error::trusted publisher exchange failed: $(jq -c 'del(.rubygems_api_key)' <<<"$response")"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dev deploy rubygems --release "$VERSION"
